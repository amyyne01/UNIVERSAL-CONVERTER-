[workspace]
resolver = "3"
members = ["crates/ahg-engine", "crates/ahg-runtime", "crates/ahg-app"]
# The interface pulls in the whole of Rune; plain `cargo test` stays on the two logic crates.
default-members = ["crates/ahg-engine", "crates/ahg-runtime"]

[workspace.package]
version = "2.0.0"
edition = "2024"

# Cargo does not inherit a dependency's patches, so Rune's are repeated here,
# at the same rev as the `rune` dependency in crates/ahg-app.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "feac7b155c5f5873ad611e8aa420ad217db5ef16" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "feac7b155c5f5873ad611e8aa420ad217db5ef16" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "feac7b155c5f5873ad611e8aa420ad217db5ef16" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "feac7b155c5f5873ad611e8aa420ad217db5ef16" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "feac7b155c5f5873ad611e8aa420ad217db5ef16" }

# Full debug info for every dependency makes a Rune build very large; these
# are the settings Rune uses for itself.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
