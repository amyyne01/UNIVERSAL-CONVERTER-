[package]
name = "ahg-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
ahg-engine = { path = "../ahg-engine" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.1"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip", "socks-proxy"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
# The entitlement layer; its source is not published.
license = ["ahg-engine/license"]
# Stand-ins for everything outside the app (`standin.rs`), for tests.
standin = []

# The crate's own tests use the stand-ins, so a plain `cargo test` sees them too.
[dev-dependencies]
ahg-runtime = { path = ".", features = ["standin"] }
