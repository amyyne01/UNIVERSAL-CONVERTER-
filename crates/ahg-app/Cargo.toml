[package]
name = "ahg-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "AHG-Converter"
path = "src/main.rs"

[dependencies]
ahg-engine = { path = "../ahg-engine" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# Rune is pre-release: one pinned commit, upgraded deliberately. The same rev
# is repeated in the workspace's [patch.crates-io].
rune = { git = "https://github.com/anomalyco/rune", rev = "feac7b155c5f5873ad611e8aa420ad217db5ef16" }

# The three directions of the design gate. Each can be built alone
# (`--no-default-features --features shelf`), so one direction's unfinished
# code never stops the other two from building.
[features]
default = ["shelf", "signal", "orbit"]
shelf = []
signal = []
orbit = []
